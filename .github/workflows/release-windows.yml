name: Windows Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag, for example v0.1.42
        required: true
      publish:
        description: Publish the verified assets to a public GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Validate tag against the source version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'A stable vX.Y.Z tag is required' }
          $version = $env:RELEASE_TAG.Substring(1)
          $definition = Get-Content CMakeLists.txt -Raw
          if ($definition -notmatch 'project\(RabbitShell VERSION ([0-9.]+)') { throw 'Missing source version' }
          if ($Matches[1] -ne $version) { throw 'Tag and source version do not match' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE) { throw 'OpenSSL installation failed' }
          $openssl = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -T v143 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DOPENSSL_ROOT_DIR=$openssl" -DRABBITSHELL_BUILD_TESTS=OFF
          if ($LASTEXITCODE) { throw 'Configuration failed' }
          $env:CL = '/MP4'
          cmake --build build --config Release --target RabbitShell --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
          $directory = "$PWD/dist/FrogShell-$env:RELEASE_VERSION"
          ./scripts/package-windows.ps1 -QtRoot $env:QT_ROOT_DIR -OpenSSLRoot $openssl -Version $env:RELEASE_VERSION -Destination $directory
          Copy-Item docs/0.1.44-update.zh-CN.md "$directory/docs/"
          $updateDoc = "docs/$env:RELEASE_VERSION-update.zh-CN.md"
          if (Test-Path -LiteralPath $updateDoc -PathType Leaf) { Copy-Item -LiteralPath $updateDoc -Destination "$directory/docs/" }
          $installerDoc = Get-ChildItem 'docs/*-installer.zh-CN.md' | Where-Object { $_.Name -match '^(\d+\.\d+\.\d+)-installer\.zh-CN\.md$' -and [version]$Matches[1] -le [version]$env:RELEASE_VERSION } | Sort-Object { [version]($_.Name -replace '-installer\.zh-CN\.md$', '') } -Descending | Select-Object -First 1
          if (!$installerDoc) { throw 'Missing installer documentation' }
          Copy-Item -LiteralPath $installerDoc.FullName -Destination "$directory/docs/"
          $validationRecord = "FrogShell-${env:RELEASE_VERSION}验证记录.md"
          if (!(Test-Path "docs/$validationRecord")) { throw "Missing release validation record: $validationRecord" }
          Copy-Item -LiteralPath "docs/$validationRecord" -Destination "$directory/docs/" -Force
          # Qt Network must have a usable TLS backend in the shipped payload.
          if (!(Test-Path "$directory/tls/qschannelbackend.dll")) { throw 'Qt Schannel TLS backend missing' }
          if (Test-Path "$openssl/bin/libssl-3-x64.dll") { Copy-Item "$openssl/bin/libssl-3-x64.dll" "$directory/" }
          python -c "import sys,json; from pathlib import Path; sys.path.insert(0,'scripts'); from portable_format import source_inventory; v=sys.argv[1]; Path('build/release-inventory.json').write_text(json.dumps({'version':v,'files':source_inventory(Path('dist/FrogShell-'+v))}),encoding='utf-8')" $env:RELEASE_VERSION
          if ($LASTEXITCODE) { throw 'Inventory failed' }
          ./scripts/package-portable-windows.ps1 -PythonExe (Get-Command python).Source -Generator 'Visual Studio 17 2022' -Toolset v143 -Version $env:RELEASE_VERSION -Source $directory -Manifest "$PWD/build/release-inventory.json"
          python scripts/verify-package.py $directory build/directory-smoke
          if ($LASTEXITCODE) { throw 'Directory smoke failed' }
          python scripts/smoke-portable-release.py --exe "dist/FrogShell-$env:RELEASE_VERSION-portable.exe" --manifest "build/portable-$env:RELEASE_VERSION/generated/payload-manifest.json" --report build/portable-smoke
          if ($LASTEXITCODE) { throw 'Portable smoke failed' }
          $digest = (Get-FileHash "dist/FrogShell-$env:RELEASE_VERSION-portable.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "PORTABLE_SHA256=$digest" >> $env:GITHUB_ENV
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" }
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            # Official, pinned vendor release; install only in this ephemeral runner's temp directory.
            $bootstrap = Join-Path $env:RUNNER_TEMP 'innosetup-6.2.2.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_2_2/innosetup-6.2.2.exe' -OutFile $bootstrap
            $hash = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne '8117d10d00a2ad33a1390978ea3872861c330e087914410a6377b22c4c5b8563') { throw 'Inno Setup bootstrap SHA-256 mismatch' }
            $toolDir = Join-Path $env:RUNNER_TEMP 'InnoSetup-6.2.2'
            $process = Start-Process -FilePath $bootstrap -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER','/PORTABLE=1','/NOICONS',"/DIR=`"$toolDir`"") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup bootstrap failed: $($process.ExitCode)" }
            $compiler = Join-Path $toolDir 'ISCC.exe'
          }
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler missing' }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build and verify installer
        shell: pwsh
        env:
          HARNESS_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = "dist/FrogShell-$env:RELEASE_VERSION-portable.exe"
          $setup = "dist/FrogShell-$env:RELEASE_VERSION-setup.exe"
          ./scripts/package-installer-windows.ps1 -Version $env:RELEASE_VERSION -PortableExe $portable -ExpectedSha256 $env:PORTABLE_SHA256 -Compiler $env:INNO_COMPILER
          if ($LASTEXITCODE) { throw 'Installer packaging failed' }
          # Only after packaging, obtain the workflow revision's test harness without changing the tag checkout.
          if ($env:HARNESS_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid workflow revision SHA' }
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -or $tagCommit -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid tag checkout commit' }
          git fetch --no-tags origin $env:HARNESS_COMMIT
          if ($LASTEXITCODE) { throw 'Could not fetch workflow revision' }
          python -c "import os,subprocess; from pathlib import Path; sha=os.environ['HARNESS_COMMIT']; paths=('scripts/verify-installer.py','scripts/portable_isolation.py'); [(Path(p).write_bytes(subprocess.check_output(['git','show',sha+':'+p]))) for p in paths]"
          if ($LASTEXITCODE) { throw 'Could not extract test harness' }
          Write-Host "Test harness commit: $env:HARNESS_COMMIT; tag checkout commit: $tagCommit"
          $harnessHashes = [ordered]@{}
          foreach ($path in @('scripts/verify-installer.py', 'scripts/portable_isolation.py')) {
            $harnessHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          python scripts/verify-installer.py --setup $setup --portable $portable --version $env:RELEASE_VERSION --expected-sha256 $env:PORTABLE_SHA256 --ci-smoke --manifest "build/portable-$env:RELEASE_VERSION/generated/payload-manifest.json" --report build/installer-smoke/installer-smoke.json
          if ($LASTEXITCODE) { throw 'Installer verification failed' }
          foreach ($path in $harnessHashes.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $harnessHashes[$path]) { throw "Test harness changed during verification: $path" }
          }
          [ordered]@{ workflow_revision_commit = $env:HARNESS_COMMIT; tag_checkout_commit = $tagCommit; script_sha256 = $harnessHashes } |
            ConvertTo-Json -Depth 3 | Set-Content build/installer-smoke/test-harness.json -Encoding utf8NoBOM
          $names = @("FrogShell-$env:RELEASE_VERSION-portable.exe", "FrogShell-$env:RELEASE_VERSION-setup.exe")
          $lines = foreach ($name in $names) { "$( (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant() )  $name" }
          $lines | Set-Content dist/SHA256SUMS -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: FrogShell-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            dist/FrogShell-${{ env.RELEASE_VERSION }}-portable.exe
            dist/FrogShell-${{ env.RELEASE_VERSION }}-setup.exe
            dist/SHA256SUMS
            build/*-smoke/*.json
      - name: Publish assets for the verified tag
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG "dist/FrogShell-$env:RELEASE_VERSION-portable.exe" "dist/FrogShell-$env:RELEASE_VERSION-setup.exe" dist/SHA256SUMS --verify-tag --generate-notes --title "FrogShell $env:RELEASE_VERSION"
          if ($LASTEXITCODE) { throw 'Release publication failed; existing assets are never overwritten' }
